<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio — Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #050505;
            --accent-blue: #0A84FF;
            --accent-purple: #BF5AF2;
            --accent-pink: #FF375F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: rgba(255,255,255,0.92);
            min-height: 100vh;
            position: relative;
        }

        /* ===== Fluid Background ===== */
        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            will-change: transform;
        }
        .orb-1 {
            width: 70vw; height: 70vw;
            top: -25%; left: -20%;
            background: radial-gradient(circle, rgba(10,132,255,0.55), transparent 65%);
            animation: drift1 28s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 65vw; height: 65vw;
            bottom: -30%; right: -15%;
            background: radial-gradient(circle, rgba(191,90,242,0.45), transparent 65%);
            animation: drift2 32s ease-in-out infinite alternate;
        }
        .orb-3 {
            width: 55vw; height: 55vw;
            top: 45%; left: 35%;
            background: radial-gradient(circle, rgba(255,55,95,0.3), transparent 60%);
            animation: drift3 24s ease-in-out infinite alternate;
        }
        @keyframes drift1 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(10%,14%) scale(1.1); }
        }
        @keyframes drift2 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(-12%,-10%) scale(1.06); }
        }
        @keyframes drift3 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(8%,-12%) scale(0.94); }
        }

        /* Noise grain overlay */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ===== Liquid Glass ===== */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(48px) saturate(200%);
            -webkit-backdrop-filter: blur(48px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.08),
                0 20px 48px rgba(0, 0, 0, 0.4);
            border-radius: 24px;
        }
        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(64px) saturate(220%);
            -webkit-backdrop-filter: blur(64px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 24px 64px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        /* ===== Segmented Control ===== */
        .segmented {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 999px;
            padding: 4px;
            display: flex;
            position: relative;
        }
        .segmented-btn {
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            transition: color 0.25s ease;
            position: relative;
            z-index: 1;
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
        }
        .segmented-btn:hover { color: rgba(255,255,255,0.75); }
        .segmented-btn.active {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .segmented-indicator {
            position: absolute;
            top: 4px; bottom: 4px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ===== Filter Buttons ===== */
        .filter-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
            border: none;
            background: none;
            text-align: left;
        }
        .filter-btn:hover {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.75);
        }
        .filter-btn.active {
            background: rgba(10, 132, 255, 0.1);
            color: rgba(255,255,255,0.95);
            box-shadow: inset 0 0 0 1px rgba(10,132,255,0.2);
        }

        /* ===== Asset Cards ===== */
        .asset-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.35s ease;
            aspect-ratio: 1 / 1;
        }
        .asset-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
        }

        .asset-card-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* Hover overlay */
        .asset-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 20px;
        }
        .asset-card:hover .asset-overlay {
            opacity: 1;
        }

        /* Video badge */
        .video-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            z-index: 2;
            background: linear-gradient(135deg, #0A84FF, #BF5AF2);
            color: white;
            box-shadow: 0 4px 12px rgba(10,132,255,0.3);
        }

        /* Tag pills */
        .tag-pill {
            display: inline-flex;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* Action buttons on card hover */
        .card-action {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
        }
        .card-action:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        .card-action.danger:hover {
            background: rgba(255, 55, 95, 0.2);
            color: #FF375F;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Fluid Background -->
    <div class="fluid-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grain"></div>

    <!-- Floating Top Navigation -->
    <nav class="fixed top-5 left-1/2 -translate-x-1/2 z-50 liquid-glass flex items-center justify-between px-2 py-2 w-[calc(100%-32px)] max-w-4xl">
        <!-- Logo -->
        <div class="flex items-center gap-2.5 pl-3 pr-4">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center"
                 style="background: linear-gradient(135deg, #0A84FF, #BF5AF2);
                        box-shadow: 0 4px 16px rgba(10,132,255,0.25);">
                <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
            </div>
            <span class="font-semibold text-[15px] tracking-tight hidden sm:block" style="color: rgba(255,255,255,0.9);">AI Studio</span>
        </div>

        <!-- Segmented Control -->
        <div class="segmented" id="navSegmented">
            <div class="segmented-indicator" id="navIndicator"></div>
            <button class="segmented-btn" data-tab="create">Create</button>
            <button class="segmented-btn active" data-tab="gallery">Gallery</button>
            <button class="segmented-btn" data-tab="collection">Collection</button>
            <button class="segmented-btn" data-tab="video">Video</button>
        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-2 pl-4">
            <button class="w-8 h-8 rounded-full flex items-center justify-center transition-all hover:bg-white/10"
                    style="border: 1px solid rgba(255,255,255,0.06);">
                <i data-lucide="moon" class="w-3.5 h-3.5" style="color: rgba(255,255,255,0.5);"></i>
            </button>
            <div class="w-8 h-8 rounded-full overflow-hidden"
                 style="border: 1px solid rgba(255,255,255,0.1);">
                <div class="w-full h-full flex items-center justify-center" style="background: rgba(255,255,255,0.08);">
                    <i data-lucide="user" class="w-3.5 h-3.5" style="color: rgba(255,255,255,0.4);"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="flex-1 flex relative z-10 pt-[84px] pb-8 px-6 w-full max-w-[1600px] mx-auto">

        <!-- Left Sidebar -->
        <aside class="w-64 shrink-0 pr-6 sidebar">
            <div class="liquid-glass p-4 sticky top-[84px]">
                <h3 class="text-[11px] font-semibold uppercase tracking-wider mb-3 px-2" style="color: rgba(255,255,255,0.25);">Library</h3>
                <div class="space-y-1">
                    <button class="filter-btn active" data-filter="all">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        All Media
                    </button>
                    <button class="filter-btn" data-filter="video">
                        <i data-lucide="video" class="w-4 h-4"></i>
                        Videos Only
                    </button>
                    <button class="filter-btn" data-filter="collection">
                        <i data-lucide="bookmark" class="w-4 h-4"></i>
                        Collection
                    </button>
                </div>

                <h3 class="text-[11px] font-semibold uppercase tracking-wider mt-6 mb-3 px-2" style="color: rgba(255,255,255,0.25);">Providers</h3>
                <div class="space-y-1 px-2" id="providerFilters"></div>
            </div>
        </aside>

        <!-- Right Content -->
        <div class="flex-1 min-w-0">

            <!-- Header -->
            <div class="flex items-end justify-between mb-6 animate-in">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight mb-1" style="color: rgba(255,255,255,0.9);" id="galleryTitle">Gallery</h1>
                    <p class="text-[13px]" style="color: rgba(255,255,255,0.35);" id="itemCount">Loading…</p>
                </div>
            </div>

            <!-- Grid (populated by JS) -->
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // ===== Segmented Control Logic =====
        function initSegmented(containerId, indicatorId) {
            const container = document.getElementById(containerId);
            const indicator = document.getElementById(indicatorId);
            const buttons = container.querySelectorAll('.segmented-btn');

            function updateIndicator(btn) {
                const rect = btn.getBoundingClientRect();
                const parent = container.getBoundingClientRect();
                indicator.style.width = rect.width + 'px';
                indicator.style.transform = `translateX(${rect.left - parent.left}px)`;
            }
            const active = container.querySelector('.segmented-btn.active');
            if (active) updateIndicator(active);
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateIndicator(btn);
                });
            });
            window.addEventListener('resize', () => {
                const a = container.querySelector('.segmented-btn.active');
                if (a) updateIndicator(a);
            });
        }

        // ===== Helpers =====
        function getImageProxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('/api/proxy/') || url.startsWith('data:')) return url;
            return `/api/proxy/image?url=${encodeURIComponent(url)}`;
        }
        function getVideoProxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('/api/proxy/')) return url;
            return `/api/proxy/video?url=${encodeURIComponent(url)}`;
        }
        function escapeHtml(t) {
            if (t === null || t === undefined) return '';
            const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML;
        }
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(() => {});
            } else {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch { /* ignore */ }
                document.body.removeChild(ta);
            }
        }

        // ===== State =====
        let images = [], videos = [];
        let currentFilter = 'all';
        let checkedProviders = null; // Set of provider names; null = show all

        const grid = document.getElementById('grid');
        const itemCount = document.getElementById('itemCount');
        const galleryTitle = document.getElementById('galleryTitle');
        const FILTER_TITLE = { all: 'Gallery', video: 'Videos', collection: 'Collection' };

        async function loadData() {
            try {
                const [imgRes, vidRes] = await Promise.all([fetch('/api/images'), fetch('/api/videos')]);
                if (imgRes.status === 401 || vidRes.status === 401) { location.href = '/login.html'; return; }
                images = await imgRes.json();
                videos = await vidRes.json();
                buildProviderFilters();
                render();
            } catch (e) {
                console.error(e);
                grid.innerHTML = `<p class="col-span-full text-center py-16" style="color:#FF375F;">Failed to load library</p>`;
            }
        }

        function buildProviderFilters() {
            const names = [...new Set([...images, ...videos].map(i => i.provider).filter(Boolean))];
            const container = document.getElementById('providerFilters');
            if (!names.length) {
                container.innerHTML = '<p class="text-[12px] py-1" style="color:rgba(255,255,255,0.25);">—</p>';
                checkedProviders = null;
                return;
            }
            checkedProviders = new Set(names);
            container.innerHTML = names.map(n => `
                <label class="flex items-center gap-3 py-2 cursor-pointer">
                    <input type="checkbox" checked data-provider="${escapeHtml(n)}" class="rounded w-4 h-4" style="accent-color:#0A84FF;">
                    <span class="text-[13px]" style="color:rgba(255,255,255,0.6);">${escapeHtml(n)}</span>
                </label>`).join('');
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) checkedProviders.add(cb.dataset.provider);
                    else checkedProviders.delete(cb.dataset.provider);
                    render();
                });
            });
        }

        function currentItems() {
            let list;
            if (currentFilter === 'video') {
                list = videos.map(v => ({ ...v, _kind: 'video' }));
            } else if (currentFilter === 'collection') {
                list = images.filter(i => i.source === 'manual').map(i => ({ ...i, _kind: 'image' }));
            } else {
                list = [
                    ...images.filter(i => i.source !== 'manual').map(i => ({ ...i, _kind: 'image' })),
                    ...videos.map(v => ({ ...v, _kind: 'video' }))
                ];
            }
            if (checkedProviders) list = list.filter(i => !i.provider || checkedProviders.has(i.provider));
            return list;
        }

        function cardHtml(item) {
            const kind = item._kind;
            const url = item.url;
            const hidden = item.hidden;
            const dim = hidden ? 'filter: blur(18px) brightness(0.5);' : '';
            const media = kind === 'video'
                ? `<video src="${escapeHtml(getVideoProxyUrl(url))}#t=0.1" class="w-full h-full object-cover" muted preload="metadata" style="${dim}"></video>`
                : `<img src="${escapeHtml(getImageProxyUrl(url))}" alt="" loading="lazy" class="w-full h-full object-cover" style="${dim}">`;
            const typePill = kind === 'video'
                ? (item.type === 'image-to-video' ? 'I2V' : item.type === 'text-to-video' ? 'T2V' : 'Video')
                : (item.source === 'manual' ? 'Collection' : 'Image');
            const date = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : '';
            return `
            <div class="asset-card animate-in" data-id="${escapeHtml(item.id)}" data-kind="${kind}" data-url="${escapeHtml(url)}" data-hidden="${hidden ? '1' : '0'}">
                ${kind === 'video' ? '<div class="video-badge">Video</div>' : ''}
                ${hidden ? '<div class="video-badge" style="left:auto;right:12px;background:rgba(0,0,0,0.6);box-shadow:none;">Hidden</div>' : ''}
                <div class="asset-card-inner">${media}</div>
                <div class="asset-overlay">
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        <span class="tag-pill" style="background:rgba(139,92,246,0.2);color:#A78BFA;border:1px solid rgba(139,92,246,0.15);">${escapeHtml(item.model || 'Unknown')}</span>
                        <span class="tag-pill" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.06);">${typePill}</span>
                        ${item.provider ? `<span class="tag-pill" style="background:rgba(10,132,255,0.15);color:#60A5FA;border:1px solid rgba(10,132,255,0.12);">${escapeHtml(item.provider)}</span>` : ''}
                    </div>
                    ${item.prompt ? `<p class="text-[12px] leading-relaxed mb-4" style="color:rgba(255,255,255,0.85);max-height:4.5em;overflow:hidden;">${escapeHtml(item.prompt)}</p>` : ''}
                    <div class="flex items-center justify-between">
                        <span class="text-[10px]" style="color:rgba(255,255,255,0.35);">${escapeHtml(date)}</span>
                        <div class="flex gap-2">
                            ${item.prompt ? `<button class="card-action" data-action="copy" title="Copy prompt"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>` : ''}
                            <a class="card-action" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="Open original"><i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>
                            <button class="card-action" data-action="hide" title="${hidden ? 'Unhide' : 'Hide'}"><i data-lucide="${hidden ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i></button>
                            <button class="card-action danger" data-action="delete" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function render() {
            const items = currentItems();
            galleryTitle.textContent = FILTER_TITLE[currentFilter] || 'Gallery';
            itemCount.textContent = items.length ? `${items.length} item${items.length === 1 ? '' : 's'}` : 'No items yet';
            grid.innerHTML = items.length
                ? items.map(cardHtml).join('')
                : `<p class="col-span-full text-center py-16" style="color:rgba(255,255,255,0.3);">Nothing here yet</p>`;
            lucide.createIcons();
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
            render();
        }

        // ===== Card action delegation =====
        grid.addEventListener('click', async (e) => {
            const actionBtn = e.target.closest('[data-action]');
            if (!actionBtn) return;
            const card = actionBtn.closest('.asset-card');
            const id = card.dataset.id;
            const kind = card.dataset.kind;
            const action = actionBtn.dataset.action;

            if (action === 'copy') {
                const p = card.querySelector('.asset-overlay p');
                copyText(p ? p.textContent : '');
            } else if (action === 'hide') {
                const currentlyHidden = card.dataset.hidden === '1';
                const base = kind === 'video' ? 'videos' : 'images';
                const res = await fetch(`/api/${base}/${id}/${currentlyHidden ? 'unhide' : 'hide'}`, { method: 'PATCH' });
                if (res.ok) {
                    const arr = kind === 'video' ? videos : images;
                    const it = arr.find(x => x.id === id);
                    if (it) it.hidden = !currentlyHidden;
                    render();
                }
            } else if (action === 'delete') {
                if (!confirm('Delete this item?')) return;
                const base = kind === 'video' ? 'videos' : 'images';
                const res = await fetch(`/api/${base}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    if (kind === 'video') videos = videos.filter(v => v.id !== id);
                    else images = images.filter(i => i.id !== id);
                    render();
                }
            }
        });

        // ===== Nav tabs: Create -> index; others set the filter here =====
        document.querySelectorAll('#navSegmented .segmented-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                if (tab === 'create') { location.href = 'index.html'; return; }
                const map = { gallery: 'all', collection: 'collection', video: 'video' };
                setFilter(map[tab] || 'all');
            });
        });

        // ===== Sidebar filter buttons =====
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });

        // ===== Init: honor ?filter= from the Create page nav =====
        const params = new URLSearchParams(location.search);
        let initFilter = params.get('filter');
        if (!['all', 'collection', 'video'].includes(initFilter)) initFilter = 'all';
        currentFilter = initFilter;

        const filterToTab = { all: 'gallery', collection: 'collection', video: 'video' };
        document.querySelectorAll('#navSegmented .segmented-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.tab === filterToTab[initFilter]));
        document.querySelectorAll('.filter-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.filter === initFilter));

        initSegmented('navSegmented', 'navIndicator');
        loadData();
    </script>
</body>
</html>
