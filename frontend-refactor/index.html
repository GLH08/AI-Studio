<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio — Create</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #050505;
            --accent-blue: #0A84FF;
            --accent-purple: #BF5AF2;
            --accent-pink: #FF375F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: rgba(255,255,255,0.92);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ===== Fluid Background ===== */
        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            will-change: transform;
        }
        .orb-1 {
            width: 70vw; height: 70vw;
            top: -25%; left: -20%;
            background: radial-gradient(circle, rgba(10,132,255,0.55), transparent 65%);
            animation: drift1 28s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 65vw; height: 65vw;
            bottom: -30%; right: -15%;
            background: radial-gradient(circle, rgba(191,90,242,0.45), transparent 65%);
            animation: drift2 32s ease-in-out infinite alternate;
        }
        .orb-3 {
            width: 55vw; height: 55vw;
            top: 45%; left: 35%;
            background: radial-gradient(circle, rgba(255,55,95,0.3), transparent 60%);
            animation: drift3 24s ease-in-out infinite alternate;
        }
        @keyframes drift1 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(10%,14%) scale(1.1); }
        }
        @keyframes drift2 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(-12%,-10%) scale(1.06); }
        }
        @keyframes drift3 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(8%,-12%) scale(0.94); }
        }

        /* Noise grain overlay */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ===== Liquid Glass Base ===== */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(48px) saturate(200%);
            -webkit-backdrop-filter: blur(48px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.08),
                0 20px 48px rgba(0, 0, 0, 0.4);
            border-radius: 24px;
        }
        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(64px) saturate(220%);
            -webkit-backdrop-filter: blur(64px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 24px 64px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        /* ===== Segmented Control ===== */
        .segmented {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 999px;
            padding: 4px;
            display: flex;
            position: relative;
        }
        .segmented-btn {
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            transition: color 0.25s ease;
            position: relative;
            z-index: 1;
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
        }
        .segmented-btn:hover { color: rgba(255,255,255,0.75); }
        .segmented-btn.active {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .segmented-indicator {
            position: absolute;
            top: 4px; bottom: 4px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ===== Inputs & Selects ===== */
        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            color: rgba(255,255,255,0.92);
            font-size: 13px;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            width: 100%;
            padding: 10px 14px;
            appearance: none;
            -webkit-appearance: none;
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.25); }
        .glass-input:focus {
            outline: none;
            border-color: rgba(10, 132, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.08);
        }
        select.glass-input {
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='rgba(255,255,255,0.4)' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
        }
        select.glass-input option {
            background: #1a1a1a;
            color: rgba(255,255,255,0.9);
        }

        /* ===== Aspect Ratio Buttons ===== */
        .ratio-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 12px 8px;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
            color: rgba(255,255,255,0.4);
        }
        .ratio-btn:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
        }
        .ratio-btn.active {
            background: rgba(255,255,255,0.1);
            border-color: rgba(10, 132, 255, 0.35);
            color: rgba(255,255,255,0.95);
            box-shadow: 0 0 16px rgba(10,132,255,0.1);
        }

        /* ===== Generate Button ===== */
        .btn-generate {
            background: linear-gradient(135deg, #0A84FF 0%, #BF5AF2 50%, #FF375F 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.25);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 50%);
            opacity: 0.4;
        }
        .btn-generate:hover {
            transform: translateY(-1px) scale(1.01);
            box-shadow: 0 12px 32px rgba(10, 132, 255, 0.35);
        }
        .btn-generate:active { transform: scale(0.98); }

        /* ===== Prompt Textarea ===== */
        .prompt-area {
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255,255,255,0.95);
            font-size: 15px;
            resize: none;
            width: 100%;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
        }
        .prompt-area::placeholder { color: rgba(255,255,255,0.3); }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.1s; opacity: 0; }
        .delay-3 { animation-delay: 0.15s; opacity: 0; }
        .delay-4 { animation-delay: 0.2s; opacity: 0; }

        /* ===== Responsive ===== */
        @media (max-width: 1024px) {
            .inspector { display: none; }
            .canvas-area { padding-right: 0 !important; }
        }
    </style>
</head>
<body class="flex flex-col">

    <!-- Fluid Background -->
    <div class="fluid-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grain"></div>

    <!-- Floating Top Navigation -->
    <nav class="fixed top-5 left-1/2 -translate-x-1/2 z-50 liquid-glass flex items-center justify-between px-2 py-2 w-[calc(100%-32px)] max-w-4xl">
        <!-- Logo -->
        <div class="flex items-center gap-2.5 pl-3 pr-4">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center"
                 style="background: linear-gradient(135deg, #0A84FF, #BF5AF2);
                        box-shadow: 0 4px 16px rgba(10,132,255,0.25);">
                <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
            </div>
            <span class="font-semibold text-[15px] tracking-tight hidden sm:block" style="color: rgba(255,255,255,0.9);">AI Studio</span>
        </div>

        <!-- Segmented Control -->
        <div class="segmented" id="navSegmented">
            <div class="segmented-indicator" id="navIndicator"></div>
            <button class="segmented-btn active" data-tab="create">Create</button>
            <button class="segmented-btn" data-tab="gallery">Gallery</button>
            <button class="segmented-btn" data-tab="collection">Collection</button>
            <button class="segmented-btn" data-tab="video">Video</button>
        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-2 pl-4">
            <button class="w-8 h-8 rounded-full flex items-center justify-center transition-all hover:bg-white/10"
                    style="border: 1px solid rgba(255,255,255,0.06);">
                <i data-lucide="moon" class="w-3.5 h-3.5" style="color: rgba(255,255,255,0.5);"></i>
            </button>
            <div class="w-8 h-8 rounded-full overflow-hidden"
                 style="border: 1px solid rgba(255,255,255,0.1);">
                <div class="w-full h-full flex items-center justify-center" style="background: rgba(255,255,255,0.08);">
                    <i data-lucide="user" class="w-3.5 h-3.5" style="color: rgba(255,255,255,0.4);"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="flex-1 flex relative z-10 pt-[84px] pb-6 px-6 h-[calc(100vh-0px)]">

        <!-- Center Canvas Area -->
        <div class="flex-1 flex flex-col relative canvas-area pr-6">

            <!-- Canvas Preview -->
            <div class="flex-1 liquid-glass-strong rounded-[28px] flex items-center justify-center relative overflow-hidden mb-0 transition-all duration-500">

                <!-- Empty State -->
                <div class="text-center flex flex-col items-center justify-center pointer-events-none select-none" id="emptyState">
                    <div class="w-[72px] h-[72px] rounded-2xl flex items-center justify-center mb-5"
                         style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);">
                        <i data-lucide="image" class="w-8 h-8" style="color: rgba(255,255,255,0.15);"></i>
                    </div>
                    <p class="text-base font-medium mb-1" style="color: rgba(255,255,255,0.5);">The canvas is ready</p>
                    <p class="text-xs" style="color: rgba(255,255,255,0.25);">Describe what you want to create below</p>
                </div>

                <!-- Loading State (hidden) -->
                <div class="hidden text-center" id="loadingState">
                    <div class="w-12 h-12 rounded-full border-2 mx-auto mb-4 animate-spin"
                         style="border-color: rgba(10,132,255,0.12); border-top-color: #0A84FF;"></div>
                    <p class="text-sm" style="color: rgba(255,255,255,0.4);">Creating your masterpiece...</p>
                </div>
            </div>

            <!-- Floating Prompt Bar (Spotlight Style) -->
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-2xl z-40">
                <div class="liquid-glass-strong p-2 flex items-end gap-2">
                    <button class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-all hover:bg-white/10 cursor-pointer"
                            style="border: 1px solid rgba(255,255,255,0.06);">
                        <i data-lucide="paperclip" class="w-4 h-4" style="color: rgba(255,255,255,0.45);"></i>
                    </button>
                    <textarea class="prompt-area py-2.5 px-1" rows="1" id="promptInput" placeholder="Describe your vision in detail..."></textarea>
                    <button class="btn-generate h-11 px-5 flex items-center gap-1.5 shrink-0" id="generateBtn">
                        <i data-lucide="arrow-up" class="w-4 h-4 relative z-10"></i>
                        <span class="relative z-10">Generate</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Inspector Panel -->
        <aside class="w-[300px] shrink-0 flex flex-col gap-4 inspector">

            <!-- Settings Panel -->
            <div class="liquid-glass flex-1 p-5 overflow-y-auto flex flex-col gap-5 animate-in delay-1">

                <!-- Section: Provider -->
                <div class="space-y-3">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full" style="background: #0A84FF;"></div>
                        <h3 class="text-[13px] font-semibold" style="color: rgba(255,255,255,0.7);">Configuration</h3>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Provider</label>
                        <select class="glass-input" id="providerSelect"></select>
                    </div>

                    <!-- Mode Segmented -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Mode</label>
                        <div class="segmented" id="modeSegmented">
                            <div class="segmented-indicator" id="modeIndicator"></div>
                            <button class="segmented-btn active" data-mode="image">Image</button>
                            <button class="segmented-btn" data-mode="edit">Edit</button>
                            <button class="segmented-btn" data-mode="video">Video</button>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Model</label>
                        <select class="glass-input" id="modelSelect"></select>
                    </div>
                </div>

                <!-- Divider -->
                <div class="h-px" style="background: rgba(255,255,255,0.06);"></div>

                <!-- Section: Parameters -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full" style="background: #BF5AF2;"></div>
                        <h3 class="text-[13px] font-semibold" style="color: rgba(255,255,255,0.7);">Parameters</h3>
                    </div>

                    <!-- Aspect Ratio -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Aspect Ratio</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="ratio-btn active flex flex-col items-center gap-1.5">
                                <div class="w-4 h-4 rounded-sm" style="border: 1.5px solid currentColor;"></div>
                                <span class="text-[10px] font-medium">1:1</span>
                            </button>
                            <button class="ratio-btn flex flex-col items-center gap-1.5">
                                <div class="w-5 h-3 rounded-sm" style="border: 1.5px solid currentColor;"></div>
                                <span class="text-[10px] font-medium">16:9</span>
                            </button>
                            <button class="ratio-btn flex flex-col items-center gap-1.5">
                                <div class="w-3 h-5 rounded-sm" style="border: 1.5px solid currentColor;"></div>
                                <span class="text-[10px] font-medium">9:16</span>
                            </button>
                        </div>
                    </div>

                    <!-- Image Count -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[11px] font-medium" style="color: rgba(255,255,255,0.3);">Number of Images</label>
                            <span class="text-[11px] font-medium tabular-nums" style="color: rgba(255,255,255,0.6);" id="countValue">1</span>
                        </div>
                        <input type="range" min="1" max="4" value="1" id="countInput" class="w-full h-1 rounded-full appearance-none cursor-pointer"
                               style="background: rgba(255,255,255,0.08); accent-color: #0A84FF;"
                               oninput="document.getElementById('countValue').textContent = this.value">
                    </div>

                    <!-- Duration (for video) -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Duration</label>
                        <select class="glass-input">
                            <option>6 seconds</option>
                            <option>10 seconds</option>
                            <option>15 seconds</option>
                        </select>
                    </div>

                    <!-- Resolution -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-medium ml-1" style="color: rgba(255,255,255,0.3);">Resolution</label>
                        <select class="glass-input">
                            <option>720p</option>
                            <option>480p</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Info Card -->
            <div class="liquid-glass p-4 animate-in delay-2">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(10,132,255,0.1); border: 1px solid rgba(10,132,255,0.15);">
                        <i data-lucide="zap" class="w-4 h-4" style="color: #0A84FF;"></i>
                    </div>
                    <div>
                        <p class="text-[12px] font-medium" style="color: rgba(255,255,255,0.7);">Multi-Provider AI</p>
                        <p class="text-[11px]" style="color: rgba(255,255,255,0.3);" id="providerCount">0 providers connected</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        lucide.createIcons();

        // ===== Segmented Control Logic =====
        function initSegmented(containerId, indicatorId) {
            const container = document.getElementById(containerId);
            const indicator = document.getElementById(indicatorId);
            const buttons = container.querySelectorAll('.segmented-btn');

            function updateIndicator(btn) {
                const rect = btn.getBoundingClientRect();
                const parent = container.getBoundingClientRect();
                indicator.style.width = rect.width + 'px';
                indicator.style.transform = `translateX(${rect.left - parent.left}px)`;
            }

            // Init with active button
            const active = container.querySelector('.segmented-btn.active');
            if (active) updateIndicator(active);

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateIndicator(btn);
                });
            });

            // Recalculate on resize
            window.addEventListener('resize', () => {
                const a = container.querySelector('.segmented-btn.active');
                if (a) updateIndicator(a);
            });
        }

        initSegmented('navSegmented', 'navIndicator');
        initSegmented('modeSegmented', 'modeIndicator');

        // ===== Aspect Ratio Buttons =====
        document.querySelectorAll('.ratio-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // ===== API Wiring =====
        const AR_TO_SIZE = { '1:1': '1024x1024', '16:9': '1792x1024', '9:16': '1024x1792' };

        function getImageProxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('/api/proxy/') || url.startsWith('data:')) return url;
            return `/api/proxy/image?url=${encodeURIComponent(url)}`;
        }
        function escapeHtml(t) {
            if (!t) return '';
            const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
        }

        let providersData = [];
        const providerSelect = document.getElementById('providerSelect');
        const modelSelect = document.getElementById('modelSelect');

        function selectedProvider() {
            return providersData.find(p => p.id === providerSelect.value);
        }
        function updateModels() {
            const p = selectedProvider();
            modelSelect.innerHTML = (p && p.models.length)
                ? p.models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')
                : '<option value="">—</option>';
        }
        async function loadProviders() {
            try {
                const res = await fetch('/api/providers');
                if (res.status === 401) { location.href = '/login.html'; return; }
                providersData = await res.json();
                providerSelect.innerHTML = providersData.length
                    ? providersData.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
                    : '<option value="">No providers configured</option>';
                document.getElementById('providerCount').textContent =
                    `${providersData.length} provider${providersData.length === 1 ? '' : 's'} connected`;
                updateModels();
            } catch (e) {
                console.error('Failed to load providers', e);
            }
        }
        providerSelect.addEventListener('change', updateModels);

        // ===== Nav tabs: Create stays here; others go to the library page =====
        document.querySelectorAll('#navSegmented .segmented-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                if (tab === 'gallery') location.href = 'library.html?filter=all';
                else if (tab === 'collection') location.href = 'library.html?filter=collection';
                else if (tab === 'video') location.href = 'library.html?filter=video';
            });
        });

        // ===== Generate =====
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const canvas = loadingState.parentElement;

        function activeAspect() {
            const el = document.querySelector('.ratio-btn.active span');
            return el ? el.textContent.trim() : '1:1';
        }
        function renderResult(data) {
            canvas.querySelector('.result-media')?.remove();
            const wrap = document.createElement('div');
            wrap.className = 'result-media absolute inset-0 flex items-center justify-center p-6 animate-in';
            wrap.innerHTML = `<img src="${getImageProxyUrl(data.url)}" alt="Generated" class="max-w-full max-h-full object-contain rounded-2xl" style="box-shadow: 0 24px 64px rgba(0,0,0,0.5);">`;
            canvas.appendChild(wrap);
        }

        generateBtn.addEventListener('click', async () => {
            const provider = providerSelect.value;
            const model = modelSelect.value;
            const prompt = promptInput.value.trim();
            if (!provider) { alert('Please select a provider'); return; }
            if (!model) { alert('Please select a model'); return; }
            if (!prompt) { alert('Please enter a prompt'); return; }

            generateBtn.disabled = true;
            emptyState.classList.add('hidden');
            canvas.querySelector('.result-media')?.remove();
            loadingState.classList.remove('hidden');

            try {
                const payload = { provider, model, prompt };
                const p = selectedProvider();
                if (p && p.type === 'openai') {
                    const size = AR_TO_SIZE[activeAspect()];
                    if (size) payload.size = size;
                }
                const count = parseInt(document.getElementById('countInput').value, 10);
                if (count > 1) payload.n = count;

                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    if (res.status === 401) { location.href = '/login.html'; return; }
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `Request failed: ${res.status}`);
                }
                const data = await res.json();
                renderResult(data.results ? data.results[0] : data);
            } catch (e) {
                alert('Error: ' + e.message);
                emptyState.classList.remove('hidden');
            } finally {
                generateBtn.disabled = false;
                loadingState.classList.add('hidden');
            }
        });

        loadProviders();
    </script>
</body>
</html>
