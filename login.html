<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #050505;
            --accent-blue: #0A84FF;
            --accent-purple: #BF5AF2;
            --accent-pink: #FF375F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: rgba(255,255,255,0.92);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ===== Fluid Background ===== */
        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.55;
            will-change: transform;
        }

        .orb-1 {
            width: 70vw; height: 70vw;
            top: -20%; left: -15%;
            background: radial-gradient(circle, rgba(10,132,255,0.6), transparent 65%);
            animation: drift1 25s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 60vw; height: 60vw;
            bottom: -25%; right: -10%;
            background: radial-gradient(circle, rgba(191,90,242,0.5), transparent 65%);
            animation: drift2 30s ease-in-out infinite alternate;
        }
        .orb-3 {
            width: 50vw; height: 50vw;
            top: 40%; left: 30%;
            background: radial-gradient(circle, rgba(255,55,95,0.35), transparent 60%);
            animation: drift3 22s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(8%,12%) scale(1.08); }
        }
        @keyframes drift2 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(-10%,-8%) scale(1.05); }
        }
        @keyframes drift3 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(6%,-10%) scale(0.95); }
        }

        /* Noise grain overlay */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ===== Liquid Glass ===== */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(60px) saturate(220%);
            -webkit-backdrop-filter: blur(60px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 24px 64px rgba(0, 0, 0, 0.45);
            border-radius: 28px;
        }

        .liquid-glass:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ===== Inputs ===== */
        .glass-input {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: rgba(255,255,255,0.95);
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            width: 100%;
            padding: 14px 18px;
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.3); }
        .glass-input:focus {
            outline: none;
            border-color: rgba(10, 132, 255, 0.5);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.1);
        }

        /* ===== Primary Button ===== */
        .btn-primary {
            background: linear-gradient(135deg, #0A84FF 0%, #BF5AF2 50%, #FF375F 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.25);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 50%);
            opacity: 0.5;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 32px rgba(10, 132, 255, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ===== Animations ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }
        .delay-100 { animation-delay: 0.1s; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; opacity: 0; }
        .delay-300 { animation-delay: 0.3s; opacity: 0; }

        /* Theme toggle */
        .theme-btn {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255,255,255,0.6);
        }
        .theme-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">

    <!-- Fluid Background -->
    <div class="fluid-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grain"></div>

    <!-- Top Right Theme Toggle -->
    <button class="theme-btn fixed top-6 right-6 z-50" id="themeToggle" title="Toggle theme">
        <i data-lucide="moon" class="w-4 h-4"></i>
    </button>

    <!-- Login Card -->
    <div class="liquid-glass w-full max-w-[400px] p-10 relative z-10 animate-fade-up">

        <!-- Logo -->
        <div class="flex justify-center mb-8 delay-100 animate-fade-up">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center"
                 style="background: linear-gradient(135deg, #0A84FF, #BF5AF2);
                        box-shadow: 0 8px 32px rgba(10,132,255,0.3);">
                <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
            </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-10 delay-200 animate-fade-up">
            <h1 class="text-2xl font-semibold mb-2 tracking-tight" style="color: rgba(255,255,255,0.95);">
                Welcome to AI Studio
            </h1>
            <p class="text-sm" style="color: rgba(255,255,255,0.45);">
                Enter your password to continue
            </p>
        </div>

        <!-- Form -->
        <form class="space-y-5 delay-300 animate-fade-up" id="loginForm">
            <div class="space-y-2">
                <label class="text-xs font-medium ml-1" style="color: rgba(255,255,255,0.4);">Password</label>
                <input type="password" id="password" placeholder="••••••••" autofocus
                       class="glass-input">
            </div>

            <button type="submit" class="btn-primary w-full h-13 flex items-center justify-center gap-2 mt-2">
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4 relative z-10"></i>
            </button>

            <p id="errorMsg" class="hidden text-center text-sm mt-1" style="color: #FF375F;">
                Invalid password. Please try again.
            </p>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center delay-300 animate-fade-up">
            <p class="text-xs" style="color: rgba(255,255,255,0.25);">
                Powered by Multi-Provider AI Engine
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Theme toggle (visual only for preview)
        const themeToggle = document.getElementById('themeToggle');
        let isDark = true;
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark
                ? '<i data-lucide="moon" class="w-4 h-4"></i>'
                : '<i data-lucide="sun" class="w-4 h-4"></i>';
            lucide.createIcons();
        });

        // Login: POST to /api/login, redirect home on success
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');
            const btn = e.target.querySelector('button[type="submit"]');
            btn.style.transform = 'scale(0.97)';
            setTimeout(() => btn.style.transform = '', 150);
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    location.href = '/';
                } else if (res.status === 429) {
                    errorMsg.textContent = 'Too many attempts. Please try again later.';
                    errorMsg.classList.remove('hidden');
                } else {
                    errorMsg.textContent = 'Invalid password. Please try again.';
                    errorMsg.classList.remove('hidden');
                }
            } catch {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
